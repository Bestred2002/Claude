name: myTVWatch
options:
  bundleIdPrefix: com.bestred2002.mytv
  createIntermediateGroups: true
  deploymentTarget:
    watchOS: "10.0"
  defaultConfig: Debug
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "4"
    INFOPLIST_FILE: "myTVWatch Watch App/Info.plist"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  myTVWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: "myTVWatch Watch App"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bestred2002.mytv.watchkitapp
        PRODUCT_NAME: myTV
        INFOPLIST_FILE: "myTVWatch Watch App/Info.plist"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
