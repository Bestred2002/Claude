name: Deploy Onde Corte to Pages

on:
  push:
    branches: [claude/shortwave-radio-app-L2lRF]
    paths:
      - 'shortwave/**'
      - '.github/workflows/pages-shortwave.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload shortwave app as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: shortwave

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
